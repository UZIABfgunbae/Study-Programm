[package]
name = "study-focus"
version = "0.1.0"
description = "Lern-Fokus-App mit Timer, Zielen und Obsidian-Integration"
authors = ["Luca"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "study_focus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
